<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hongyu Jin's Blog - Log in</title>
    <link rel="stylesheet" href="main/css/index.css">
</head>
<body>
    <div class="login-container">
        <div class="illustration-section">
            <h1 class="brand-title">Hongyu Jin's Blog</h1>
            <p class="brand-subtitle">Welcome to my personal community</p>
            <!--<div class="illustration"></div>-->

            <div class="illustration">
                <svg width="200" height="180" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="30" cy="30" r="6" fill="#f8c0b0" opacity="0.8" />
                    <circle cx="170" cy="40" r="5" fill="#a8d8c8" opacity="0.8" />
                    <circle cx="150" cy="20" r="4" fill="#f2d5a0" opacity="0.8" />
                    <ellipse cx="100" cy="145" rx="60" ry="10" fill="#b2e0d0" opacity="0.4" />
                    <rect x="32" y="160" width="8" height="4" rx="2" fill="#1a2624" opacity="0.2" />
                    <rect x="160" y="160" width="8" height="4" rx="2" fill="#1a2624" opacity="0.2" />
                    <rect x="20" y="70" width="160" height="12" rx="2" fill="url(#tableGradient)" />
                    <rect x="22" y="71" width="156" height="3" rx="1" fill="#c1ebe0" opacity="0.3" />
                    <rect x="30" y="82" width="8" height="80" fill="#1a3330" opacity="0.7" />
                    <rect x="162" y="82" width="8" height="80" fill="#1a3330" opacity="0.7" />
                    <rect x="130" y="70" width="40" height="12" fill="#e0edff" rx="2" />
                    <rect x="135" y="73" width="12" height="6" rx="1" fill="#1a3330" opacity="0.6" />
                    <rect x="85" y="45" width="30" height="25" rx="3" fill="url(#potGradient)" />
                    <rect x="87" y="47" width="10" height="15" rx="2" fill="#ffd6b8" opacity="0.3" />
                    <path d="M100 45 Q100 25 100 25" stroke="#559e68" stroke-width="2" fill="none" />
                    <path d="M100 30 Q90 22 80 30" stroke="#559e68" stroke-width="2" fill="none" />
                    <path d="M100 30 Q110 22 120 30" stroke="#559e68" stroke-width="2" fill="none" />
                    <path d="M100 35 Q95 30 75 40" stroke="#559e68" stroke-width="2" fill="none" />
                    <path d="M100 35 Q105 30 125 40" stroke="#559e68" stroke-width="2" fill="none" />
                    <circle cx="50" cy="75" r="2" fill="#ffffff" opacity="0.2" />
                    <circle cx="120" cy="73" r="1.5" fill="#ffffff" opacity="0.15" />
                    <defs>
                        <linearGradient id="tableGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#1a3330;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#142926;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="potGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#f8c0b0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#e8a090;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>
 
        <div class="form-section">
            <h2 class="form-title">Log In</h2>
 
            <div class="form-group">
                <input id="username" type="text" class="form-input" placeholder="Account">
            </div>

            <div class="form-group">
                <input id="password" type="password" class="form-input" placeholder="Password">
            </div>

            <button class="login-btn" id="login-btn">Log In</button>

            <label class="agreement-row">
                <input id="agreement" type="checkbox">
                <span>I have read and agree to the <a target="_blank" href="main/html/blog.html">User Agreement</a> and <a target="_blank" href="https://smart-cat-1.github.io/Personal-Portfolio/">Privacy Policy</a></span>
            </label>

            <label class="remember-row">
                <input id="remember" type="checkbox">
                <span>Remember this account for 7 days"</span>
            </label>

            <button class="register-link-btn" id="go-register">Register</button>
             <div><p class="or-p">or</p></div>
            <button class="guest-link-btn" id="guest-login">Guest Access</button>
         </div>
    </div>
    <script src="main/js/index.js"></script>
</body>
</html>
