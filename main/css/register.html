<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
<div class="login-container register-page">
  <div class="form-section">
    <h2 class="form-title">Register</h2>
    <p class="form-subtitle">创建新账号</p>
    <div class="form-group"><input id="reg-username" class="form-input" type="text" placeholder="New Account"></div>
    <div class="form-group"><input id="reg-password" class="form-input" type="password" placeholder="New Password"></div>
    <p id="reg-message" class="error-text"></p>
    <button id="register-submit" class="login-btn">Create Account</button>
    <button id="back-login" class="register-link-btn">Back to Login</button>
  </div>
</div>
<script src="../js/register.js"></script>
</body>
</html>
