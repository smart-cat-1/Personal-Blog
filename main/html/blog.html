<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hongyu Jin's Blog</title>
  <link rel="stylesheet" href="../css/blog.css">
</head>
<body>
  <header class="blog-header">
    <h1 class="blog-title">Hongyu Jin's Blog</h1>
    <div>
      <button id="switch-account" class="logout-btn">Switch Account</button>
      <button id="logout" class="logout-btn">Log Out</button>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <img class="img-me" src="../../assets/images/me.jpg" alt="Avatar">
      <button class="info-tag">Name: Hongyu Jin</button>
      <button class="info-tag">Full-Stack Engineer</button>
      <p class="bio">Only administrator accounts can publish content; standard accounts can only like and comment, while guests can only browse.</p>
    </aside>

    <main class="blog-feed">
      <section id="post-editor" class="post-editor hidden">
        <textarea id="new-post-text" placeholder="发布一条新动态..."></textarea>
        <input id="new-post-image" type="url" placeholder="可选：输入图片 URL">
        <button id="publish-btn">发布</button>
      </section>
      <div id="posts"></div>
    </main>
  </div>

  <script src="../js/blog.js"></script>
</body>
</html>
